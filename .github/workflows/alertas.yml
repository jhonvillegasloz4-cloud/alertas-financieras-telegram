name: Alertas Financieras Telegram

on:
  schedule:
    # Ejecutar diariamente a las 9:00 AM (hora de Bogotá = UTC-5, entonces 14:00 UTC)
    - cron: '0 14 * * *'

  # Permite ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  alertas:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot

      - name: Ejecutar alertas
        run: python3 alertas_telegram.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID_JHONATAN: ${{ secrets.CHAT_ID_JHONATAN }}
          CHAT_ID_ESPOSA: ${{ secrets.CHAT_ID_ESPOSA }}
